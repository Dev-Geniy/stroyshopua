name: Синхронізація товарів і сторінок сайту

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'   # кожні 3 години
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-feed.yml'
      - 'tools/sync_feed.py'
      - 'tools/feed-settings.json'
      - 'tools/site.py'
      - 'tools/shell.html'
      - 'tools/povernennya.md'
      - 'blog.json'
      - 'reviews.json'
      - 'shop.js'
      - 'shop.css'
      - 'page.js'
      - 'page.css'
      - 'config.js'

permissions:
  contents: write

concurrency:
  group: sync-feed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Завантажити фід постачальника
        id: feed
        continue-on-error: true
        run: |
          mkdir -p /tmp/feed
          curl -fsSL --retry 4 --retry-delay 10 -m 300 \
            -o /tmp/feed/dropoffice.xml \
            "https://kabinet.dropoffice.com.ua/data/133e00933fe472a1cdb222016e9631f4.xml"
          ls -la /tmp/feed
          grep -c "<offer " /tmp/feed/dropoffice.xml

      - name: Зберегти сирий фід у гілку feed-source
        if: steps.feed.outcome == 'success'
        run: |
          rm -rf /tmp/src && mkdir /tmp/src && cd /tmp/src
          git init -q -b feed-source
          cp /tmp/feed/dropoffice.xml .
          git add dropoffice.xml
          git -c user.name=feed-bot -c user.email=feed-bot@users.noreply.github.com commit -qm "Фід DROPOFFICE $(date -u +%F' '%H:%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feed-source:feed-source

      - name: Оновити каталог магазину
        if: steps.feed.outcome == 'success' && hashFiles('tools/sync_feed.py') != ''
        run: python3 tools/sync_feed.py /tmp/feed/dropoffice.xml

      - name: Згенерувати сторінки товарів, категорій, блогу й відгуків
        run: python3 tools/site.py --changed /tmp/changed.txt

      - name: Зберегти зміни
        id: commit
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add -A products.xml catalog p c blog blog.html reviews.html povernennya.html 404.html sitemap.xml robots.txt llms.txt catalog-report.json tools/catalog-state.json app/catalog.json
          if git diff --cached --quiet; then echo "Без змін"; echo "pushed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -qm "Оновлення товарів, цін і сторінок сайту"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      - name: Повідомити пошуковики про нові сторінки (IndexNow — Bing та інші)
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        run: |
          sleep 90   # дати GitHub Pages опублікувати зміни
          python3 - <<'PY'
          import glob, json, os, re, urllib.request
          key = next((os.path.basename(f)[:-4] for f in glob.glob('*.txt') if re.fullmatch(r'[0-9a-f]{32}\.txt', os.path.basename(f))), None)
          urls = [u.strip() for u in open('/tmp/changed.txt', encoding='utf-8') if u.strip()]
          if not key or not urls:
              print('Немає ключа або змінених сторінок'); raise SystemExit
          urls = ['https://samostroy.shop/', 'https://samostroy.shop/sitemap.xml'] + urls
          for i in range(0, len(urls), 9000):
              body = json.dumps({'host': 'samostroy.shop', 'key': key, 'keyLocation': f'https://samostroy.shop/{key}.txt', 'urlList': urls[i:i + 9000]}).encode()
              req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body, headers={'Content-Type': 'application/json; charset=utf-8'})
              try:
                  print('IndexNow:', urllib.request.urlopen(req, timeout=30).status, len(urls[i:i + 9000]), 'адрес')
              except Exception as e:
                  print('IndexNow помилка:', e)
          PY
