<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Моя вітрина — Samostroy</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f1;--card:#fff;--ink:#22282e;--soft:#636c74;--line:#dde1e4;--field:#f3f4f5;--acc:#f08a1c;--acc-ink:#1f2328;--ok:#2f8a4c;--bad:#c2410c;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#15191d;--card:#1f2429;--ink:#eef0f1;--soft:#a1aab2;--line:#323941;--field:#272d33;--ok:#5cc47e;--bad:#ff8a50}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:15px/1.5 "Golos Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}a{color:var(--acc)}
img{display:block;max-width:100%}[hidden]{display:none!important}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.top .in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:62px}
.top h1{font:700 18px/1.2 Unbounded,"Golos Text",sans-serif}
.top .st{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--field);white-space:nowrap}
.st.mod{background:color-mix(in srgb,#e07b0e 18%,var(--card));color:#b45f08}.st.pub{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}.st.off{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:11px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:14.5px;text-decoration:none;white-space:nowrap}
.btn.ghost{background:var(--field);color:var(--ink)}.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn.busy{pointer-events:none;opacity:.7}.btn.busy::after{content:"";width:15px;height:15px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
.btn[disabled]{opacity:.5;pointer-events:none}
@keyframes sp{to{transform:rotate(1turn)}}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--soft);font-weight:600;font-size:14px;text-decoration:none}
.wrap{max-width:1320px;margin:0 auto;padding:18px 16px 110px;display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:22px;align-items:start}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}.pv{display:none}.wrap.showpv .pv{display:block}.wrap.showpv .ed{display:none}}
.tabs{display:none;gap:6px;padding:0 16px 10px;max-width:1320px;margin:0 auto}
@media(max-width:1000px){.tabs{display:flex}}
.tabs button{flex:1;height:38px;border-radius:10px;background:var(--field);font-weight:700;font-size:14px;color:var(--soft)}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card>h2{font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.card>h2 .n{width:26px;height:26px;border-radius:8px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-size:13px}
.card>p.sub{color:var(--soft);font-size:13.5px;margin-bottom:14px}
.f{display:block;margin-bottom:12px}.f>span{display:block;font-size:13px;color:var(--soft);font-weight:600;margin:0 0 5px 2px}
.f input,.f textarea,.f select{width:100%;height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);padding:0 12px;font-size:15.5px;outline:none}
.f textarea{height:90px;padding:10px 12px;resize:vertical}
.f input:focus,.f textarea:focus{border-color:var(--acc)}
.f small{display:block;font-size:12.5px;color:var(--soft);margin:5px 2px 0}.f small.bad{color:var(--bad)}.f small.ok{color:var(--ok)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}}
.slug{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--field);overflow:hidden}
.slug b{padding:0 2px 0 12px;color:var(--soft);font-weight:500;white-space:nowrap;font-size:14.5px}
.slug input{border:0;background:none;height:44px;flex:1;min-width:60px;padding:0 12px 0 0;outline:none;font-size:15.5px;font-weight:600}
.up{display:flex;gap:12px;align-items:center}
.up .ph{width:72px;height:72px;border-radius:12px;background:var(--field);border:1.5px dashed var(--line);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--soft);font-size:11px;text-align:center}
.up .ph img{width:100%;height:100%;object-fit:cover}.up .ph.wide{width:128px}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:560px){.themes{grid-template-columns:1fr 1fr}}
.th{border:2px solid var(--line);border-radius:12px;padding:8px;text-align:left;background:var(--card)}
.th[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.th .mini{height:70px;border-radius:8px;overflow:hidden;display:grid;grid-template-rows:22px 1fr;gap:4px;padding:5px}
.th .mini i{display:block;border-radius:4px}.th .mini .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.th b{display:block;font-size:13.5px;margin-top:6px}.th small{font-size:11.5px;color:var(--soft)}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2.5px var(--ink)}
.sw input[type=color]{width:38px;height:38px;border:0;background:none;padding:0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{height:40px;padding:0 14px;border-radius:10px;background:var(--field);font-weight:600;font-size:14px;border:1.5px solid transparent}
.seg button[aria-pressed=true]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.lbl{font-size:13px;color:var(--soft);font-weight:600;margin:0 0 6px 2px}
.range{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.range input[type=range]{flex:1;accent-color:var(--acc)}
.range input[type=number]{width:80px;height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);text-align:center;font-weight:700}
.ex{background:var(--field);border-radius:10px;padding:10px 12px;font-size:14px}
.ex b{color:var(--ok)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500;margin:8px 0}.chk input{width:18px;height:18px;accent-color:var(--acc)}
.items{border-top:1px solid var(--line)}
.it{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it img,.it .noimg{width:48px;height:48px;border-radius:9px;object-fit:cover;background:var(--field)}
.it .t b{display:block;font-size:13.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t small{font-size:12px;color:var(--soft)}.it .t small.out{color:var(--bad);font-weight:700}
.it .c{display:flex;align-items:center;gap:6px}
.it .c input{width:86px;height:36px;border:1.5px solid var(--line);border-radius:9px;background:var(--field);text-align:right;padding:0 8px;font-weight:700;font-size:14px}
.it .c input.bad{border-color:var(--bad)}
.it .c button{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--soft);background:var(--field)}
.it .c button.on{color:#e0a500;background:color-mix(in srgb,#e0a500 16%,var(--card))}
.it .c button.on .i{fill:currentColor}
@media(max-width:560px){.it{grid-template-columns:44px minmax(0,1fr)}.it .c{grid-column:1/3;justify-content:flex-end}}
.more{display:block;margin:10px auto 0;color:var(--soft);font-size:14px;font-weight:600}
.links .ln{display:flex;gap:8px;align-items:center;background:var(--field);border-radius:10px;padding:8px 8px 8px 12px;margin-bottom:8px}
.links .ln code{flex:1;font:600 14px/1.3 ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links .ln small{display:block;font:500 11.5px "Golos Text";color:var(--soft)}
.qr{display:flex;gap:14px;align-items:center;margin:12px 0}
.qr img{width:120px;height:120px;border-radius:10px;background:#fff;padding:6px}
.txt{background:var(--field);border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap;margin-bottom:6px}
.note{font-size:13.5px;color:var(--soft)}
.warn{background:color-mix(in srgb,#e07b0e 12%,var(--card));border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.pv{position:sticky;top:80px}
.phone{width:100%;max-width:410px;height:calc(100vh - 110px);max-height:820px;border-radius:30px;border:10px solid #111;overflow:hidden;background:#111;box-shadow:0 20px 50px -24px rgba(0,0,0,.5);margin:0 auto}
.phone iframe{width:100%;height:100%;border:0;background:#fff}
.pv p{text-align:center;color:var(--soft);font-size:12.5px;margin-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:1320px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .msg{flex:1;font-size:13.5px;color:var(--soft);min-width:0}
.bar .btn{min-height:48px;padding:0 22px}
.center{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px}
.center h2{font:700 22px Unbounded,"Golos Text",sans-serif;margin-bottom:10px}.center p{color:var(--soft);max-width:460px;margin:0 auto 18px}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-150%);z-index:90;background:rgba(25,28,32,.95);color:#fff;font-weight:600;font-size:14px;padding:11px 16px;border-radius:12px;transition:transform .25s;max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
/* вибір товарів */
.pk{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto}
.pk .hd{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px max(16px,calc((100vw - 1240px)/2))}
.pk .hd .r1{display:flex;gap:10px;align-items:center;margin-bottom:10px}.pk .hd h3{font-size:18px;flex:1}
.pk .hd .r2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pk .q{flex:1 1 260px;height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;font-size:16px;outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.chips button{flex:none;height:34px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.pk .gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:14px max(16px,calc((100vw - 1240px)/2)) 40px}
.pc{background:var(--card);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.pc.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 35%,transparent)}
.pc .im{position:relative;aspect-ratio:1;background:var(--field);display:block;width:100%}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .pl{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.3);border:2.5px solid rgba(255,255,255,.85);backdrop-filter:blur(3px);color:#fff;box-shadow:0 6px 20px -6px rgba(0,0,0,.45)}
.pc .pl .i{width:34px;height:34px;stroke-width:3.2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.pc .im:hover .pl{animation:pul 1s ease-in-out infinite;background:rgba(240,138,28,.55)}
.pc.on .pl{background:var(--acc);color:var(--acc-ink)}.pc.on .pl .i{filter:none}
@keyframes pul{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@media(hover:none){.pc .im:hover .pl{animation:none}}
.pc .b{padding:8px 10px 10px}.pc .b b{font-size:13px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.pc .b span{font-weight:700;font-size:14px}
</style>
</head>
<body>
<header class="top"><div class="in"><a class="back" id="back" href="../kabinet.html#mine">‹ Кабінет</a><h1>Моя вітрина</h1><span class="st" id="st" hidden></span><span class="sp"></span>
 <a class="btn ghost sm" id="open" target="_blank" rel="noopener" hidden>Відкрити вітрину</a></div>
 <div class="tabs" id="tabs"><button data-tab="ed" aria-pressed="true">Налаштування</button><button data-tab="pv" aria-pressed="false">Перегляд</button></div></header>
<main id="main"><div class="center"><div><h2>Завантаження…</h2></div></div></main>
<div class="toast" id="toast"></div>
<script src="../config.js?v=356bf6eb"></script>
<script src="config.js?v=2153ffb5"></script>
<script src="edit.js?v=50afc8d9"></script>
</body>
</html>
